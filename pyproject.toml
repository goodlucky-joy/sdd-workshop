[project]
name = "todo-cli"
version = "0.1.0"
description = "Terminal-based Todo CLI application"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "typer>=0.9.0",
  "sqlalchemy>=2.0.0",
]
[project.scripts]
todo = "cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["cli", "todo_lib"]

